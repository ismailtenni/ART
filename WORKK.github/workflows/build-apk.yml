name: Build ART-ISMAILTENNI APK

# Runs by itself when you change the ANDROID-APP folder,
# or when you press the green "Run workflow" button on the Actions page.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ANDROID-APP/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: ANDROID-APP
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file ART-ISMAILTENNI.apk
        run: |
          mkdir -p out
          cp ANDROID-APP/app/build/outputs/apk/release/app-release.apk out/ART-ISMAILTENNI.apk
          ls -la out

      - name: Keep the APK on the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: ART-ISMAILTENNI-apk
          path: out/ART-ISMAILTENNI.apk

      - name: Publish a download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/ART-ISMAILTENNI.apk \
            --title "ART-ISMAILTENNI (Android app)" \
            --notes "Download ART-ISMAILTENNI.apk, open it on your Android phone and install it."
