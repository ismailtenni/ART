name: ART-ISMAILTENNI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ANDROID-APP/**'
      - '.github/workflows/1main.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android tools
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        working-directory: ANDROID-APP
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Find and rename APK
        shell: bash
        run: |
          set -e
          mkdir -p out
          APK=$(find ANDROID-APP/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was generated."
            find ANDROID-APP/app/build/outputs -type f || true
            exit 1
          fi

          cp "$APK" out/ART-ISMAILTENNI.apk
          ls -lh out/ART-ISMAILTENNI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ART-ISMAILTENNI-apk
          path: out/ART-ISMAILTENNI.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/ART-ISMAILTENNI.apk \
            --title "ART-ISMAILTENNI Android App" \
            --notes "Download ART-ISMAILTENNI.apk and install it on your Android device."
