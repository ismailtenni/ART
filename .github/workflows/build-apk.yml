name: ART-ISMAILTENNI APK

# Runs by itself when you change the ANDROID-APP folder,
# or when you press the green "Run workflow" button on the Actions page.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ANDROID-APP/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > ANDROID-APP/local.properties

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Make the signing key
        working-directory: ANDROID-APP
        run: |
          rm -f art.keystore
          keytool -genkeypair -keystore art.keystore -storetype PKCS12 \
            -alias art -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass artismailtenni -keypass artismailtenni \
            -dname "CN=ART ISMAILTENNI, O=ISMAILTENNI ART, C=MA"

      - name: Build the APK
        working-directory: ANDROID-APP
        continue-on-error: true
        id: build
        run: gradle assembleRelease --no-daemon --console=plain > ../build.log 2>&1

      - name: Show the real error (only if the build failed)
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========== THE REAL ERROR IS BELOW ==========="
          grep -n -i -E "what went wrong|error|failed|not found|could not" build.log | grep -v "^\s*[0-9]*:\s*at " | head -40
          echo "=========== LAST LINES ==========="
          grep -v "^\s*at " build.log | tail -25
          exit 1

      - name: Name the file ART-ISMAILTENNI.apk
        run: |
          mkdir -p out
          cp ANDROID-APP/app/build/outputs/apk/release/app-release.apk out/ART-ISMAILTENNI.apk
          ls -la out

      - name: Keep the APK on the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: ART-ISMAILTENNI-apk
          path: out/ART-ISMAILTENNI.apk

      - name: Publish a download link (Releases page)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/ART-ISMAILTENNI.apk \
            --title "ART-ISMAILTENNI (Android app)" \
            --notes "Download ART-ISMAILTENNI.apk, open it on your Android phone and install it."
