plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ismailtenni.art'
    compileSdk 34

    defaultConfig {
        applicationId "com.ismailtenni.art"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    signingConfigs {
        release {
            storeFile file('../art.keystore')
            storePassword 'artismailtenni'
            keyAlias 'art'
            keyPassword 'artismailtenni'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
